name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualification_host:
        description: Runner qualification (x64 selects ABI only)
        required: false
        default: shared
        type: choice
        options: [shared, mac, x64]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.qualification_host == 'mac' && '["self-hosted","Linux","react-doctor-local-hermes-ephemeral","ci-host-tlpr-mac"]' || inputs.qualification_host == 'x64' && '["self-hosted","Linux","react-doctor-local-hermes-ephemeral","X64"]' || '["self-hosted","Linux","react-doctor-local-hermes-ephemeral"]') || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2 # base de la PR (HEAD^1) pour détecter une PR de doc seule

      - name: Execution architecture evidence
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash scripts/ci-host-evidence.sh

      # PR de doc seule (*.md, docs/) : pas de CI complète (décision du
      # 12/11/2026). Le job garde son nom (check requis satisfait) : les
      # étapes lourdes sont sautées. Push sur la branche par défaut et
      # lancement manuel : toujours la CI complète.
      - name: Detect doc-only changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT_NAME" = pull_request ]; then
            # --no-renames : un fichier déplacé vers docs/ compte aussi par son ancien chemin.
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            # Fichiers sous docs/ ou en .md lus par l'application : du code, pas de la doc.
            runtime='^skills/'
            code_files=$( { printf '%s\n' "$files" | grep -vE '(\.md$|^docs/)'; printf '%s\n' "$files" | grep -E "$runtime"; } || true )
            if [ -n "$files" ] && [ -z "$code_files" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

      - uses: pnpm/action-setup@v4

      # Runner self-hosted avec volume de cache persistant (ci-worker-orchestrator,
      # `CI_CACHE_DIR`) : store pnpm, cache npm et navigateurs Playwright y sont déjà,
      # donc on saute les caches GitHub (lents depuis les Mac). Sans volume :
      # comportement inchangé.
      - name: Cache local du runner ?
        id: cicache
        shell: bash
        run: |
          if [ -n "${CI_CACHE_DIR:-}" ] && [ -d "$CI_CACHE_DIR" ] && [ -w "$CI_CACHE_DIR" ]; then
            echo "local=true" >> "$GITHUB_OUTPUT"
            echo "Volume de cache local : $CI_CACHE_DIR"
          else
            echo "local=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.cicache.outputs.local != 'true' && 'pnpm' || '' }}

      - name: CI regression guards
        run: node --test tests/ci/*.test.mjs

      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.code == 'true'

      - run: pnpm test
        if: steps.changes.outputs.code == 'true'

      - run: pnpm typecheck
        if: steps.changes.outputs.code == 'true'

      - run: pnpm lint
        if: steps.changes.outputs.code == 'true'

      - run: pnpm format:check
        if: steps.changes.outputs.code == 'true'

      - name: Smoke test built CLI
        if: steps.changes.outputs.code == 'true'
        run: |
          cd packages/react-doctor
          pnpm build
          BUILT_VERSION=$(node bin/react-doctor.js --version)
          echo "Built CLI reports version: $BUILT_VERSION"
          if [ -z "$BUILT_VERSION" ] || [ "$BUILT_VERSION" = "0.0.0" ]; then
            echo "Built CLI version is missing or 0.0.0; build env did not inject VERSION"
            exit 1
          fi
